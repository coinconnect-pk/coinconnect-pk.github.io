title: CoinConnect Intelligence
tagline: Pakistan's virtual asset framework, explained completely — licensing, compliance, tax and market entry
description: >-
  Complete, primary-source analysis of Pakistan's virtual asset regulation for
  operators: licensing, compliance, tax, corporate structure, the sandbox and
  enforcement — read from the published documents themselves.
url: "https://blog.coinconnect.site"
baseurl: ""
email: info@coinconnect.site
lang: en_GB

# The parent brand. The blog is a standalone property that links back to it.
parent:
  name: CoinConnect
  url: "https://coinconnect.site"

author:
  name: Malik Abbas
  title: Chief Executive Officer
  # Paste your real LinkedIn profile URL here. Left blank on purpose —
  # the footer hides the link entirely until you fill it in.
  linkedin: ""

org:
  city: Karachi
  country: Pakistan
  country_code: PK

# Google Search Console verification.
# Search Console -> HTML tag -> paste ONLY the content="..." value here.
google_site_verification: ""

# Permanent standalone structure. Odoo keeps the root domain, so the blog owns
# its own clean paths and never needs a migration re-map.
permalink: /:title/

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - overrides/
  - _queue/
  - .github/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Malik Abbas"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
