name: Publish article

on:
  schedule:
    # Two articles a day, Pakistan Standard Time (UTC+5).
    #
    # Deliberately OFF the hour. GitHub runs scheduled workflows on a
    # best-effort basis and drops them under load -- and minute :00 is the most
    # congested minute on the whole platform, because that is what everyone
    # picks. Our first :00 schedule never fired at all.
    #
    # A third midday slot is a cheap safety net: each run publishes up to the
    # daily limit, so whichever run does fire catches the day up.
    - cron: "17 1 * * *"    # 06:17 PKT
    - cron: "43 7 * * *"    # 12:43 PKT (safety net)
    - cron: "17 13 * * *"   # 18:17 PKT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only, do not publish (preview)"
        type: boolean
        default: false
      force:
        description: "Publish even if today's limit is reached"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python .github/scripts/publish.py

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "CoinConnect Bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && git diff --staged --quiet; then
            echo "Nothing changed. Skipping commit."
            exit 0
          fi
          git add -A
          git commit -m "Publish article for $(date -u -d '+5 hours' +%Y-%m-%d)"
          git push
