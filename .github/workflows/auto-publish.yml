name: Daily article

on:
  schedule:
    # 06:00 Pakistan Standard Time = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only, do not publish (preview)"
        type: boolean
        default: false
      force:
        description: "Publish even if a post already exists for today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish today's article
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python .github/scripts/publish.py

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "CoinConnect Bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && git diff --staged --quiet; then
            echo "Nothing changed today. Skipping commit."
            exit 0
          fi
          git add -A
          git commit -m "Publish article for $(date -u -d '+5 hours' +%Y-%m-%d)"
          git push
